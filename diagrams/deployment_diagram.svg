<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .bg{fill:#071025}
    .title{fill:#fff;font-family:Arial;font-size:18px;font-weight:bold}
    .node{fill:#071a2a;stroke:#60a5fa;stroke-width:2}
    .label{fill:#dbeafe;font-family:Arial;font-size:13px}
    .arrow{stroke:#94a3b8;stroke-width:2;marker-end:url(#a)}
  </style>
  <rect width="100%" height="100%" class="bg"/>
  <text x="20" y="30" class="title">Deployment Diagram — TelcoGuard</text>

  <rect x="40" y="80" width="160" height="60" rx="6" class="node"/>
  <text x="60" y="115" class="label">Client Browser</text>

  <rect x="240" y="80" width="180" height="60" rx="6" class="node"/>
  <text x="260" y="115" class="label">Streamlit Host</text>

  <rect x="460" y="80" width="180" height="60" rx="6" class="node"/>
  <text x="480" y="115" class="label">API Host (AKS/ACI)</text>

  <rect x="680" y="80" width="180" height="60" rx="6" class="node"/>
  <text x="700" y="115" class="label">Azure ML</text>

  <line x1="200" y1="110" x2="240" y2="110" class="arrow"/>
  <line x1="420" y1="110" x2="460" y2="110" class="arrow"/>
  <line x1="640" y1="110" x2="680" y2="110" class="arrow"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>