<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .bg{fill:#071025}
    .title{fill:#fff;font-family:Arial;font-size:18px;font-weight:bold}
    .node{fill:#071a2a;stroke:#60a5fa;stroke-width:2}
    .label{fill:#dbeafe;font-family:Arial;font-size:13px}
    .arrow{stroke:#94a3b8;stroke-width:2;marker-end:url(#a)}
  </style>
  <rect width="100%" height="100%" class="bg"/>
  <text x="20" y="30" class="title">Data Flow — TelcoGuard</text>

  <rect x="40" y="80" width="180" height="60" rx="6" class="node"/>
  <text x="60" y="115" class="label">Source Systems</text>

  <rect x="260" y="80" width="160" height="60" rx="6" class="node"/>
  <text x="290" y="115" class="label">Raw Storage</text>

  <rect x="460" y="80" width="180" height="60" rx="6" class="node"/>
  <text x="500" y="115" class="label">Processed Storage</text>

  <rect x="680" y="80" width="180" height="60" rx="6" class="node"/>
  <text x="700" y="115" class="label">Analytics Warehouse</text>

  <!-- Model & Serving -->
  <rect x="300" y="220" width="200" height="60" rx="6" class="node"/>
  <text x="330" y="255" class="label">Model Training</text>

  <rect x="560" y="220" width="200" height="60" rx="6" class="node"/>
  <text x="600" y="255" class="label">Model Registry / Serving</text>

  <line x1="220" y1="110" x2="260" y2="110" class="arrow"/>
  <line x1="420" y1="110" x2="460" y2="110" class="arrow"/>
  <line x1="640" y1="110" x2="680" y2="110" class="arrow"/>
  <line x1="560" y1="140" x2="560" y2="220" class="arrow"/>
  <line x1="500" y1="250" x2="460" y2="140" class="arrow"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>