<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .bg{fill:#071025}
    .title{fill:#fff;font-family:Arial;font-size:18px;font-weight:bold}
    .actor{fill:#9fb6ff;font-family:Arial;font-size:13px}
    .participant{fill:#0b1220;stroke:#60a5fa;stroke-width:2}
    .p-text{fill:#dbeafe;font-family:Arial;font-size:13px}
    .line{stroke:#94a3b8;stroke-width:2;marker-end:url(#a)}
  </style>
  <rect width="100%" height="100%" class="bg" />
  <text x="20" y="30" class="title">Prediction Flow — Sequence Diagram</text>

  <!-- Participants -->
  <text x="60" y="70" class="actor">User</text>
  <rect x="140" y="50" width="140" height="30" class="participant"/>
  <text x="150" y="72" class="p-text">Streamlit UI</text>
  <rect x="320" y="50" width="160" height="30" class="participant"/>
  <text x="340" y="72" class="p-text">FastAPI Model API</text>
  <rect x="520" y="50" width="140" height="30" class="participant"/>
  <text x="540" y="72" class="p-text">Model Registry</text>
  <rect x="680" y="50" width="140" height="30" class="participant"/>
  <text x="700" y="72" class="p-text">GenAI Service</text>

  <!-- Arrows -->
  <line x1="80" y1="120" x2="160" y2="120" class="line" />
  <text x="170" y="115" class="p-text">submit customer data</text>

  <line x1="280" y1="160" x2="340" y2="160" class="line" />
  <text x="190" y="155" class="p-text">POST /predict</text>

  <line x1="480" y1="200" x2="540" y2="200" class="line" />
  <text x="370" y="195" class="p-text">load best model</text>

  <line x1="340" y1="240" x2="520" y2="240" class="line" />
  <text x="370" y="235" class="p-text">predict()</text>

  <line x1="480" y1="280" x2="700" y2="280" class="line" />
  <text x="520" y="275" class="p-text">request explanation</text>

  <line x1="700" y1="320" x2="340" y2="320" class="line" />
  <text x="360" y="315" class="p-text">explanation</text>

  <line x1="160" y1="360" x2="80" y2="360" class="line" />
  <text x="200" y="355" class="p-text">result + confidence + explanation</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>