<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .box{fill:#071025;stroke:#60a5fa;stroke-width:2}
    .title{fill:#fff;font-family:Arial;font-size:18px;font-weight:bold}
    .label{fill:#dde9fb;font-family:Arial;font-size:13px}
  </style>
  <rect width="100%" height="100%" fill="#071025"/>
  <text x="20" y="30" class="title">TelcoGuard — Core Class Diagram</text>

  <!-- StreamlitApp -->
  <rect x="40" y="60" width="220" height="110" rx="6" class="box" />
  <text x="60" y="90" class="label">StreamlitApp</text>
  <text x="60" y="110" class="label">+load_model()</text>
  <text x="60" y="130" class="label">+predict(input)</text>
  <text x="60" y="150" class="label">+render_dashboard()</text>

  <!-- FeatureEngineering -->
  <rect x="340" y="60" width="220" height="110" rx="6" class="box" />
  <text x="360" y="90" class="label">FeatureEngineering</text>
  <text x="360" y="110" class="label">+load_data()</text>
  <text x="360" y="130" class="label">+create_features()</text>
  <text x="360" y="150" class="label">+save_engineered()</text>

  <!-- Trainer -->
  <rect x="40" y="220" width="220" height="110" rx="6" class="box" />
  <text x="60" y="250" class="label">Trainer</text>
  <text x="60" y="270" class="label">+train()</text>
  <text x="60" y="290" class="label">+evaluate()</text>
  <text x="60" y="310" class="label">+save_model()</text>

  <!-- GenAI -->
  <rect x="340" y="220" width="220" height="110" rx="6" class="box" />
  <text x="360" y="250" class="label">GenAIService</text>
  <text x="360" y="270" class="label">+analyze_customer()</text>
  <text x="360" y="290" class="label">+generate_action_plan()</text>

  <!-- AzureMLOps -->
  <rect x="640" y="140" width="220" height="120" rx="6" class="box" />
  <text x="660" y="170" class="label">AzureMLOps</text>
  <text x="660" y="190" class="label">+register_model()</text>
  <text x="660" y="210" class="label">+deploy()</text>
  <text x="660" y="230" class="label">+monitor()</text>

  <!-- Lines -->
  <line x1="160" y1="170" x2="160" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" />
  <line x1="260" y1="110" x2="340" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" />
  <line x1="460" y1="270" x2="640" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" />

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>