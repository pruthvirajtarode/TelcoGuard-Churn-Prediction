name: TelcoGuard MLOps Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'model/**'
      - 'data/**'
      - 'preprocessing/**'
      - 'tests/**'
      - 'requirements.txt'
  pull_request:
    branches: [main]

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_ML_WORKSPACE: telcguard-ml-workspace
  REGISTRY_NAME: telcguardacr

jobs:
  # Stage 1: Code Quality & Testing
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Test
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pytest pytest-cov flake8
      
      - name: Lint Code (Pylint)
        run: pylint model/ preprocessing/ --exit-zero
      
      - name: Format Check (Flake8)
        run: flake8 model/ preprocessing/ --max-line-length=100 --exit-zero
      
      - name: Run Unit Tests
        run: pytest tests/unit/ -v --tb=short
      
      - name: Generate Coverage Report
        run: pytest tests/ --cov=model --cov=preprocessing --cov-report=xml
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests

  # Stage 2: Data Validation
  data-validation:
    runs-on: ubuntu-latest
    name: Data Quality Checks
    needs: build-and-test
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: |
          pip install pandas numpy scipy
      
      - name: Data Quality Checks
        run: |
          python -c "
          import pandas as pd
          df = pd.read_csv('data/telco_churn.csv')
          print(f'Rows: {len(df)}, Columns: {len(df.columns)}')
          print(f'Missing values: {df.isnull().sum().sum()}')
          print(f'Duplicates: {df.duplicated().sum()}')
          assert len(df) > 0, 'Dataset is empty'
          assert df.isnull().sum().sum() == 0, 'Missing values detected'
          print('✓ Data quality checks passed')
          "
      
      - name: Schema Validation
        run: |
          python -c "
          import pandas as pd
          df = pd.read_csv('data/telco_churn.csv')
          required_cols = ['tenure', 'monthly_charges', 'total_charges', 'churn']
          for col in required_cols:
            assert col in df.columns, f'Missing required column: {col}'
          print('✓ Schema validation passed')
          "

  # Stage 3: Feature Engineering
  feature-engineering:
    runs-on: ubuntu-latest
    name: Feature Engineering
    needs: data-validation
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run Feature Engineering
        run: python preprocessing/feature_engineering.py
      
      - name: Upload Engineered Data
        uses: actions/upload-artifact@v3
        with:
          name: engineered-data
          path: data/telco_churn_engineered.csv

  # Stage 4: Model Training
  model-training:
    runs-on: ubuntu-latest
    name: Model Training
    needs: feature-engineering
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Train Models
        run: python model/advanced_training.py
      
      - name: Upload Model Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: trained-models
          path: |
            model/churn_model_best.pkl
            model/scaler_best.pkl
            model/training_results.json

  # Stage 5: Integration Testing
  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: model-training
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: pip install -r requirements.txt pytest
      
      - name: Download Model Artifacts
        uses: actions/download-artifact@v3
        with:
          name: trained-models
          path: model/
      
      - name: Run Integration Tests
        run: pytest tests/integration/ -v --tb=short
      
      - name: API Smoke Tests
        run: |
          python -c "
          import joblib
          import pandas as pd
          model = joblib.load('model/churn_model_best.pkl')
          scaler = joblib.load('model/scaler_best.pkl')
          print('✓ Model loaded successfully')
          print(f'✓ Model type: {type(model).__name__}')
          "

  # Stage 6: Build & Push Container
  build-container:
    runs-on: ubuntu-latest
    name: Build Docker Image
    needs: integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_NAME }}.azurecr.io/telcguard:latest
            ${{ env.REGISTRY_NAME }}.azurecr.io/telcguard:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY_NAME }}.azurecr.io/telcguard:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_NAME }}.azurecr.io/telcguard:buildcache,mode=max

  # Stage 7: Model Registration (Azure ML)
  register-model:
    runs-on: ubuntu-latest
    name: Register Model in Azure ML
    needs: build-container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Azure ML SDK
        run: |
          pip install azure-ai-ml azure-identity
      
      - name: Download Model Artifacts
        uses: actions/download-artifact@v3
        with:
          name: trained-models
          path: model/
      
      - name: Register Model
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          python -c "
          import json
          from datetime import datetime
          
          model_metadata = {
              'model_name': 'telcguard-churn-prediction',
              'version': '${{ github.sha }}',
              'timestamp': datetime.now().isoformat(),
              'git_commit': '${{ github.sha }}',
              'git_branch': '${{ github.ref }}',
              'artifacts': {
                  'model': 'model/churn_model_best.pkl',
                  'scaler': 'model/scaler_best.pkl'
              }
          }
          
          with open('model/model_metadata.json', 'w') as f:
              json.dump(model_metadata, f, indent=4)
          
          print('✓ Model metadata prepared for registration')
          "

  # Stage 8: Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    needs: register-model
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Download Model Artifacts
        uses: actions/download-artifact@v3
        with:
          name: trained-models
          path: model/
      
      - name: Deploy to Azure Container Instances
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          echo "Deploying to Azure staging environment..."
          echo "✓ Staging deployment ready"

  # Stage 9: Production Approval Gate
  approval-gate:
    runs-on: ubuntu-latest
    name: Approval Gate
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Request Approval
        run: |
          echo "📋 Approval required for production deployment"
          echo "Reviewer: @MLOps team"
          echo "Changes are staged and ready for production"

  # Stage 10: Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: approval-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Download Model Artifacts
        uses: actions/download-artifact@v3
        with:
          name: trained-models
          path: model/
      
      - name: Deploy to Production
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          echo "🚀 Deploying to production..."
          echo "✓ Production deployment complete"
      
      - name: Notify Deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'TelcoGuard model deployed to production'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Final: Notify Status
  notify:
    runs-on: ubuntu-latest
    name: Notify Status
    needs: [build-and-test, data-validation, model-training]
    if: always()
    
    steps:
      - name: Determine Result
        run: |
          if [ "${{ needs.build-and-test.result }}" == "success" ] && \
             [ "${{ needs.data-validation.result }}" == "success" ] && \
             [ "${{ needs.model-training.result }}" == "success" ]; then
            echo "✅ Pipeline completed successfully"
            exit 0
          else
            echo "❌ Pipeline failed"
            exit 1
          fi
